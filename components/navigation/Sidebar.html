<!-- 1. Top Context & Header Bar -->

  <div class="flex items-center gap-3">
    <!-- Sidebar Toggle Button -->
    <button onclick="toggleSouthernSidebar()" class="p-1.5 rounded hover:bg-slate-700 text-slate-300 transition-colors" title="Toggle Navigation">
      <i class="fa-solid fa-bars text-base"></i>

    <!-- Company Branding & Active Branch -->

      <span class="font-bold text-sm text-white tracking-wide">Southern Olive Oil Products S.A.R.L</span>
      <span class="text-slate-500">|</span>
      
      <!-- Branch Selector Dropdown -->
      <div class="relative inline-block">
        <select id="branchSelector" onchange="handleBranchChange(this.value)" class="bg-slate-800 text-xs text-amber-400 font-semibold border border-slate-700 rounded px-2.5 py-1 focus:outline-none focus:border-amber-500 cursor-pointer">
          <option value="choueifat" selected>فرع الشويفات (الرئيسي)</option>
          <option value="beirut">فرع بيروت</option>
          <option value="pressing_plant">المعصرة والإنتاج المركزي</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Breadcrumbs & Status -->
  <div class="flex items-center gap-3 text-xs">
    <nav id="vanguardBreadcrumbs" class="flex items-center gap-1.5 text-slate-400">
      <span>Home</span>
      <i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
      <span class="text-white font-medium" id="currentModuleBreadcrumb">Operations & Pressing Center</span>
      <i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
      <span class="text-amber-400" id="currentScreenBreadcrumb">Olive Pressing & Production</span>
    </nav>
    <div class="h-4 w-px bg-slate-700"></div>
    <div class="flex items-center gap-1.5 text-emerald-400 font-medium">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span>System Live</span>
    </div>
  </div>
</header>

    <div class="nav-item">
      <button onclick="switchSouthernScreen('fleet', '2. SuperSonic Fleet Management', 'Fleet Telemetry')" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-md text-[13px] font-medium hover:bg-slate-800/70 hover:text-white transition-colors group">

    <!-- 6. Accounting & Finance -->
    <div class="nav-item">

          <i class="fa-solid fa-calculator text-slate-400 group-hover:text-amber-400 text-sm w-4 text-center"></i>
          <span>6. Accounting & Finance</span>

    <!-- 7. HR & Payroll Management -->
    <div class="nav-item">

<!-- ========================================================================= -->
<!-- JAVASCRIPT CONTROLLERS & EVENT HANDLERS                                   -->
<!-- ========================================================================= -->
<script>
  /**
   * Toggles the main Sidebar open/close state
   */
  function toggleSouthernSidebar() {
    const sidebar = document.getElementById("southernSidebar");
    if (sidebar) {
      sidebar.classList.toggle("hidden");
    }
  }

  /**
   * Toggles Accordion groups in the Sidebar
   */
  function toggleAccordion(groupId) {
    const group = document.getElementById(groupId);
    if (!group) return;
    
    const content = group.querySelector(".accordion-content");
    const arrow = group.querySelector(".accordion-arrow");
    
    if (content) {
      const isHidden = content.classList.toggle("hidden");
      if (arrow) {
        arrow.style.transform = isHidden ? "rotate(-90deg)" : "rotate(0deg)";
      }
    }
  }

  /**
   * Switches screens and automatically synchronizes Breadcrumbs and active states
   */
  function switchSouthernScreen(screenKey, moduleName, subScreenName) {
    // 1. Update Breadcrumbs in Header
    const modBreadcrumb = document.getElementById("currentModuleBreadcrumb");
    const scrBreadcrumb = document.getElementById("currentScreenBreadcrumb");
    
    if (modBreadcrumb && moduleName) modBreadcrumb.textContent = moduleName;
    if (scrBreadcrumb && subScreenName) scrBreadcrumb.textContent = subScreenName;

    // 2. Hide all workspace page views and display target screen
    const allViews = document.querySelectorAll(".vanguard-screen-view");
    allViews.forEach(view => {
      view.classList.add("hidden");
      view.classList.remove("active");
    });

    const targetView = document.getElementById("view-" + screenKey);
    if (targetView) {
      targetView.classList.remove("hidden");
      targetView.classList.add("active");
    }

    // 3. Update Subnav Active Styling
    const allSubnavs = document.querySelectorAll(".subnav-btn");
    allSubnavs.forEach(btn => {
      btn.classList.remove("active-subnav", "text-amber-300", "bg-amber-500/10", "font-medium");
      btn.classList.add("text-slate-400");
    });

    if (event && event.currentTarget && event.currentTarget.classList.contains("subnav-btn")) {
      const current = event.currentTarget;
      current.classList.add("active-subnav", "text-amber-300", "bg-amber-500/10", "font-medium");
      current.classList.remove("text-slate-400");
    }

    console.log(`[Vanguard ERP] Switched to module: ${moduleName} -> ${subScreenName}`);
  }

  /**
   * Handles switching the active company branch
   */
  function handleBranchChange(selectedBranch) {
    localStorage.setItem("vanguard_active_branch", selectedBranch);
    console.log(`[Vanguard ERP] Active branch updated to: ${selectedBranch}`);
    // Optional: trigger branch data refresh event across active modules
    window.dispatchEvent(new CustomEvent("vanguardBranchChanged", { detail: { branch: selectedBranch } }));
  }

  // Restore active branch on initial load
  document.addEventListener("DOMContentLoaded", function () {
    const savedBranch = localStorage.getItem("vanguard_active_branch");
    const branchSelector = document.getElementById("branchSelector");
    if (savedBranch && branchSelector) {
      branchSelector.value = savedBranch;
    }
  });
</script>
