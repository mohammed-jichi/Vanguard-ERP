<!DOCTYPE html>
<html lang="en">

<head>
  <script>
    localStorage.setItem('so_authenticated', 'true');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Control & POS Terminal - Southern Olive & Oil Products</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css?v=4.0" />
  <style>
    body {
      background-color: #0f1319;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .pos-standalone-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .pos-standalone-header {
      background: #121814;
      border-bottom: 2px solid var(--olive-gold);
      padding: 10px 20px;
    }

    .pos-body-grid {
      display: grid;
      grid-template-columns: 1fr 400px;
      flex: 1;
      overflow: hidden;
    }

    .pos-products-panel {
      padding: 20px;
      overflow-y: auto;
      background: #0f1319;
    }

    .pos-cart-panel {
      background: #171e27;
      border-left: 1px solid rgba(219, 177, 112, 0.2);
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow: hidden;
    }

    .pos-cart-items-list {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 15px;
    }

    .pos-product-touch-card {
      background: #1e2631;
      border: 1px solid rgba(219, 177, 112, 0.2);
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pos-product-touch-card:hover {
      border-color: var(--olive-gold);
      transform: translateY(-2px);
      background: #25303e;
    }

    .pos-cat-btn {
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.88rem;
    }

    .pos-cat-btn.active {
      background-color: var(--olive-gold) !important;
      color: #121814 !important;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <div class="pos-standalone-container">
    <!-- POS HEADER -->
    <header class="pos-standalone-header d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <img src="/assets/images/logo.png" alt="Vanguard Logo" height="46" class="circular-logo" />
        <div>
          <h5 class="text-warning mb-0"><i class="fa-solid fa-cash-register me-2"></i> Vanguard ERP System. (License:
            <span class="displayCompanyId">001</span>)
          </h5>
          <small class="text-muted">منتوجات زيت وزيتون الجنوب ش.م.م - محطة مبيعات الصندوق والتسليم | الدعم:
            71801140</small>
        </div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span class="badge bg-success p-2"><i class="fa-solid fa-circle me-1 fs-6"></i> Cashier Terminal #01
          (Active)</span>
        <button class="btn btn-sm btn-outline-info"
          onclick="if(window.opener&&window.opener.openCustomerBackScreenDisplay){window.opener.openCustomerBackScreenDisplay();}else{showToast('Back Display', 'Customer Back Screen Active', 'info');}"><i
            class="fa-solid fa-desktop me-1"></i> Back Display</button>
        <button class="btn btn-sm btn-outline-warning" onclick="generateZReport()"><i
            class="fa-solid fa-print me-1"></i> Z-Report (EOD)</button>
        <a href="/index.html" class="btn btn-sm btn-outline-light"><i class="fa-solid fa-house me-1"></i> Main ERP</a>
      </div>
    </header>

    <!-- POS BODY GRID -->
    <div class="pos-body-grid">

      <!-- LEFT PRODUCTS SELECTION PANEL -->
      <div class="pos-products-panel">
        <div class="row g-2 mb-3">
          <div class="col-md-9">
            <input type="text" id="posSearchInput"
              class="form-control form-control-lg bg-dark text-white border-secondary"
              placeholder="Scan Barcode / Custom Code / Search Product..." onkeyup="filterPOSProducts(this.value)" />
          </div>
          <div class="col-md-3">
            <button class="btn btn-lg btn-warning w-100 fw-bold" onclick="triggerBarcodeScanSim()"><i
                class="fa-solid fa-barcode me-1"></i> Scan</button>
          </div>
        </div>

        <div class="d-flex gap-2 mb-3">
          <button class="btn btn-dark pos-cat-btn active" onclick="filterPOSCat('all', this)">All Products</button>
          <button class="btn btn-dark pos-cat-btn" onclick="filterPOSCat('Olive Oil', this)">Olive Oil</button>
          <button class="btn btn-dark pos-cat-btn" onclick="filterPOSCat('Olives & Jars', this)">Olives & Jars</button>
          <button class="btn btn-dark pos-cat-btn" onclick="filterPOSCat('Artisan', this)">Artisan Packs</button>
        </div>

        <div class="row g-3" id="posProductsGrid">
          <!-- Dynamically Rendered Touch Cards -->
        </div>
      </div>

      <!-- RIGHT CART SIDEBAR -->
      <div class="pos-cart-panel">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="text-warning mb-0"><i class="fa-solid fa-cart-shopping me-2"></i> Active Invoice Order</h5>
          <button class="btn btn-sm btn-outline-danger" onclick="clearPOSCart()">Clear</button>
        </div>

        <div class="mb-3">
          <label class="form-label text-muted small">Order Type Mode</label>
          <select id="posOrderType" class="form-select bg-dark text-white border-secondary">
            <option value="Online">Online Delivery</option>
            <option value="Dining">Dining Room / Direct Retail</option>
            <option value="Wholesale">Wholesale Bulk Export</option>
          </select>
        </div>

        <div class="pos-cart-items-list" id="posCartItems">
          <p class="text-muted text-center py-4">No items added to invoice.</p>
        </div>

        <div class="border-top border-secondary pt-3">
          <div class="d-flex justify-content-between mb-1">
            <span>Subtotal:</span>
            <strong id="cartSubtotal">$0.00</strong>
          </div>
          <div class="d-flex justify-content-between mb-1">
            <span>Delivery Fee:</span>
            <span id="cartDeliveryFee">$3.00</span>
          </div>
          <div class="d-flex justify-content-between mb-3 text-warning fs-4">
            <strong>Total:</strong>
            <strong id="cartTotal">$3.00</strong>
          </div>

          <div class="d-grid gap-2">
            <button class="btn btn-success btn-lg fw-bold py-2" onclick="processPOSPayment('Cash')">
              <i class="fa-solid fa-money-bill-wave me-1"></i> Pay Cash (USD / LBP)
            </button>
            <div class="d-flex gap-2">
              <button class="btn btn-primary w-50 fw-bold" onclick="processPOSPayment('Wish Money')">Wish Money</button>
              <button class="btn btn-secondary w-50 fw-bold" onclick="processPOSPayment('Network Card')">Credit
                Card</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const items = (typeof posProducts !== 'undefined' && posProducts.length) ? posProducts : (window.posProducts || [
        { id: 101, name: 'Extra Virgin Olive Oil 1L', price: 12.00, category: 'Olive Oil', image: 'assets/images/evoo.jpg' },
        { id: 102, name: 'Organic Green Olives Jar 500g', price: 6.50, category: 'Olives & Jars', image: 'assets/images/olives.jpg' },
        { id: 103, name: 'Koura Extra Virgin Oil 15.2kg Tin', price: 85.00, category: 'Olive Oil', image: 'assets/images/tin.jpg' },
        { id: 104, name: 'Artisan Olive Soap Pack (3x)', price: 4.50, category: 'Artisan', image: 'assets/images/soap.jpg' }
      ]);
      if (typeof renderPOSProducts === 'function') {
        renderPOSProducts(items);
      }
    });
  </script>
</body>

</html>
